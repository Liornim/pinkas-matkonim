<html lang="he" dir="rtl">

<title>פנקס מתכונים</title>

<style>
:root{--ground:#E8EBE3;--surface:#FBFBF7;--ink:#1B241C;--muted:#6B7566;--line:#D3D8CB;--accent:#6B2140;--data:#46613A;--warn:#F6E7EA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:'Heebo',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 140px}
h1,h2,h3,.serif{font-family:'Frank Ruhl Libre',Georgia,serif}
header{padding:26px 0 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{color:var(--accent);font-size:28px;font-weight:900;margin:0;line-height:1}
.sub{font-size:12px;color:var(--muted);margin-top:6px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{background:var(--accent);color:#FBFBF7;border-radius:999px;padding:13px 20px;font-weight:700;width:100%;box-shadow:0 4px 14px rgba(107,33,64,.22)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:500;padding:11px 20px;margin-top:8px}
.btn:disabled{opacity:.55}
.btn-ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:14px}
.btn-ghost.on{background:var(--accent);color:#FBFBF7;border-color:var(--accent)}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:4px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;display:block;width:100%;text-align:right}
.card.tap{cursor:pointer}
.card.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.tap a{position:relative;z-index:1}
.macros{display:flex;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.m{flex:1;text-align:center}
.m b{font-family:'Frank Ruhl Libre',serif;font-size:17px;display:block;line-height:1}
.m.big b{font-size:25px}
.m small{font-size:10px;color:var(--muted);display:block;margin-top:5px}
.m i{font-style:normal;font-size:10px;color:var(--muted);font-weight:400}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px;font-weight:500}
input,textarea,select{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:120px;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--data);border-radius:2px}
.ing{padding:13px 16px;background:var(--surface)}
.ing+.ing{border-top:1px solid var(--line)}
.list-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.ing-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ing-top b{font-family:'Frank Ruhl Libre',serif;font-size:15px;flex-shrink:0}
.tiny{font-size:11px;color:var(--muted);margin-top:6px}
.tag{font-size:9.5px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted);margin-inline-start:5px;white-space:nowrap}
.tag.ai{color:var(--accent);border-color:#E2CBD3;background:#FAF2F4}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:16px}
.alert{background:var(--warn);color:var(--accent);border-radius:8px;padding:12px;font-size:13.5px;margin-top:14px;line-height:1.55}
.info{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13.5px;margin-top:14px;color:var(--muted)}
.pulse{animation:pl 1.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.5}50%{opacity:1}}
.dock{position:fixed;inset-inline:0;bottom:0;padding:34px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--ground) 60%,transparent);pointer-events:none}
.dock>div{max-width:640px;margin:0 auto;pointer-events:auto}
ol{padding-inline-start:0;list-style:none;margin:12px 0 0}
ol li{display:flex;gap:12px;margin-bottom:14px}
ol li span{color:var(--accent);font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:14px;flex-shrink:0;padding-top:2px}
ol li div{font-size:15px;line-height:1.65}
.sec{margin-top:30px}
.sec h3{font-size:18px;margin:0 0 2px}
.results{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--surface)}
.results button{display:block;width:100%;text-align:right;padding:11px 13px;font-size:14px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:none}
.results button small{color:var(--muted);font-size:11px;margin-inline-start:6px}
.hide{display:none}
.empty{text-align:center;margin-top:56px}
.empty p{color:var(--muted);font-size:14px;line-height:1.7}
details{margin-top:22px}
summary{font-size:13px;color:var(--muted);cursor:pointer;padding:6px 0}
.gear{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.ver{text-align:center;font-size:10.5px;color:var(--muted);margin-top:34px;opacity:.75}
.log{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.7;background:#F2F3EE;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){

function r0(n){return Math.round(Number(n)||0)}
function r1(n){n=Number(n)||0;return Math.round(n*10)/10}
function num(v){var x=parseFloat(String(v).replace(",","."));return isNaN(x)?0:x}

function factor(i){return i.basis==="unit"?(Number(i.qty)||0):(Number(i.qty)||0)/100}
function ingTotals(i){var x=factor(i),p=i.per||{};
  return{k:(p.k||0)*x,p:(p.p||0)*x,c:(p.c||0)*x,f:(p.f||0)*x,s:(p.s||0)*x,b:(p.b||0)*x}}
function recipeTotals(r){
  return (r.ingredients||[]).reduce(function(t,i){var v=ingTotals(i);
    return{k:t.k+v.k,p:t.p+v.p,c:t.c+v.c,f:t.f+v.f,s:t.s+v.s,b:t.b+v.b}},
    {k:0,p:0,c:0,f:0,s:0,b:0})}
function amountLabel(i){

  return i.basis==="unit"?(q+" "+(i.unitName||"יחידה")):(q+" גר'")}

var LOG=[];
function logAdd(o){
  LOG.unshift(o); if(LOG.length>25)LOG.pop();

function mask(u){return String(u).replace(/key=[^&]+/,"key=***")}
function req(label,url,opts){
  var t0=Date.now();
  return fetch(url,opts||{}).then(function(res){
    return res.text().then(function(txt){
      var d=null; try{d=JSON.parse(txt)}catch(e){}
      logAdd({t:new Date().toLocaleTimeString("he-IL"),label:label,
        method:(opts&&opts.method)||"GET",url:mask(url),status:res.status,ms:Date.now()-t0,
        err:res.ok?"":((d&&d.error&&d.error.message)||txt.slice(0,180))});
      return{status:res.status,ok:res.ok,d:d||{},raw:txt};
    });
  }).catch(function(e){
    logAdd({t:new Date().toLocaleTimeString("he-IL"),label:label,
      method:(opts&&opts.method)||"GET",url:mask(url),status:0,ms:Date.now()-t0,
      err:e.name+": "+e.message,net:true});
    throw new Error(netHint(e));
  });
}
function netHint(e){
  return "הבקשה לא יצאה מהמכשיר ("+e.message+"). זה קורה כשאין אינטרנט, "+
    "כשהקובץ נפתח דרך נתיב פנימי כמו content:// שהדפדפן מגביל, "+
    "או כשתוסף חוסם. הכי בטוח: לשמור את הקובץ בתיקייה רגילה ולפתוח אותו משם, או להעלות אותו לאירוח.";
}

function hasHebrew(t){return /[\u0590-\u05FF]/.test(String(t||""))}
function needsTranslation(e){
  var t=String((e&&e.steps)||"").trim();
  if(!t)return false;
  var heb=(t.match(/[\u0590-\u05FF]/g)||[]).length;
  var lat=(t.match(/[A-Za-z]/g)||[]).length;
  /* יחידות שהומרו מוסיפות מעט אותיות עבריות לטקסט אנגלי — לכן משווים כמויות */
  return lat>=12&&lat>heb*1.5;
}

function translateSteps(e,srcText){
  var src=String(srcText||e.stepsSrc||e.steps||"").slice(0,4000);
  var payload=JSON.stringify({title:e.title||"",yield:e.yield||"",steps:src});
  var prompt='Translate this recipe into Hebrew. Return ONLY valid JSON, no markdown:\n'+
    '{"title":"Hebrew title","yield":"Hebrew yield text or empty string","steps":["Hebrew step",...]}\n'+
    'Rules: every value must be written in Hebrew script. One action per step, imperative. '+
    'Convert Fahrenheit to Celsius, lb/oz/cups/tbsp/tsp to grams or ml, inches to cm. '+
    'Keep brand names in their original spelling. If a field is empty in the input, return an empty string for it.\n'+
    'Input: '+payload;
  return req("תרגום","https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+
    ":generateContent?key="+encodeURIComponent(apiKey),
    {method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
       generationConfig:{temperature:0,maxOutputTokens:4096,responseMimeType:"application/json"}})})
  .then(function(o){
    if(!o.ok){
      var m=(o.d.error&&o.d.error.message)||"";
      if(o.status===429)throw new Error("חרגת מהמכסה החינמית. נסה שוב בעוד כמה דקות.");
      if(o.status===404)throw new Error("שם המודל לא נמצא. עדכן אותו בהגדרות.");
      if(o.status===400&&/API key/i.test(m))throw new Error("המפתח לא תקין. בדוק אותו בהגדרות.");
      throw new Error(m||("שגיאה "+o.status));
    }
    var cand=o.d.candidates&&o.d.candidates[0];
    var txt=(cand&&cand.content&&cand.content.parts)?cand.content.parts.map(function(p){return p.text||""}).join(""):"";
    var a=txt.indexOf("{"),b=txt.lastIndexOf("}");
    if(a<0||b<0)throw new Error("לא התקבל תרגום.");
    var r=JSON.parse(txt.slice(a,b+1));
    var out=Array.isArray(r.steps)?r.steps.join("\n"):String(r.steps||"");
    if(!out.trim())throw new Error("התרגום חזר ריק.");
    if(!hasHebrew(out))throw new Error("המודל החזיר טקסט שאינו בעברית. נסה שוב, או החלף מודל בהגדרות.");
    if(!e.stepsSrc)e.stepsSrc=src;
    e.steps=out;
    if(r.title&&hasHebrew(r.title)&&!hasHebrew(e.title||""))e.title=String(r.title).slice(0,200);
    if(r.yield&&!e.yield)e.yield=String(r.yield).slice(0,80);
    return e;
  });
}

/* ===== המספרים שמוצגים: מה שהמתכון מפרסם קודם, החישוב שלנו רק כגיבוי ===== */
function mulM(m,n){return{k:m.k*n,p:m.p*n,c:m.c*n,f:m.f*n}}
function recipeNumbers(r){
  var comp=recipeTotals(r);
  var sv=Math.max(1,Number(r.servings)||1);
  if(r.stated&&Number(r.stated.k)>0){
    var st={k:Number(r.stated.k)||0,p:Number(r.stated.p)||0,
            c:Number(r.stated.c)||0,f:Number(r.stated.f)||0};
    var perBasis=r.statedBasis==="serving";
    /* המתכון פרסם ערכים למנה אך לא ציין כמה מנות — אין דרך לדעת את הסך הכל */
    var unknown=perBasis&&r.svKnown===false&&sv===1;
    var total=perBasis?mulM(st,sv):st;
    var per=perBasis?st:mulM(st,1/sv);
    return{total:total,per:per,servings:sv,fromRecipe:true,unknown:unknown,computed:comp};
  }
  return{total:{k:comp.k,p:comp.p,c:comp.c,f:comp.f},
    per:mulM({k:comp.k,p:comp.p,c:comp.c,f:comp.f},1/sv),
    servings:sv,fromRecipe:false,unknown:false,computed:comp};
}
/* הצעה למספר מנות, נגזרת מהיחס בין החישוב לבין מה שפורסם למנה */
function suggestServings(r){
  var comp=recipeTotals(r);
  if(!r.stated||!(Number(r.stated.k)>0)||!(comp.k>0))return 0;
  var n=Math.round(comp.k/Number(r.stated.k));
  return (n>=2&&n<=60)?n:0;
}

/* קישור בטוח — רק http/https, אחרת לא מוצג כלל */
function safeUrl(u){
  var t=String(u||"").trim();
  if(!t)return "";
  var scheme=t.match(/^([a-z][a-z0-9+.\-]*):/i);
  if(scheme){
    /* סכימה שאינה http/https נדחית לגמרי — javascript:, data:, file: וכדומה */
    if(!/^https?$/i.test(scheme[1]))return "";
  }else{
    t="https://"+t.replace(/^\/+/,"");
  }
  return /^https?:\/\/[^\s"'<>\\]+\.[^\s"'<>\\]+$/i.test(t)?t.slice(0,500):"";
}
function shortUrl(u){
  var t=String(u||"").replace(/^https?:\/\//i,"").replace(/^www\./i,"");
  return t.length>44?t.slice(0,44)+"…":t;
}

function s(v,max){return typeof v==="string"?v.slice(0,max||300):""}

function sanitizeRecipe(o){
  if(!o||typeof o!=="object"||!o.id||typeof o.id!=="string")return null;
  var r={id:s(o.id,60),title:s(o.title,200),source:s(o.source,120),yield:s(o.yield,80),
    cat:s(o.cat,60),by:s(o.by,60),note:s(o.note,4000),steps:s(o.steps,8000),stepsSrc:s(o.stepsSrc,8000),ingredientsSrc:s(o.ingredientsSrc,4000),
    updated:n0(o.updated),link:safeUrl(o.link),
    servings:Math.max(1,Math.min(999,Math.round(n0(o.servings))||1)),
    statedBasis:(o.statedBasis==="serving")?"serving":"total",svKnown:o.svKnown!==false,
    ingredients:[],stated:null};
  if(Array.isArray(o.ingredients))r.ingredients=o.ingredients.slice(0,80).map(function(i){
    var p=(i&&i.per)||{};
    return{name:s(i&&i.name,160),basis:(i&&i.basis==="unit")?"unit":"100g",
      unitName:s(i&&i.unitName,40)||"גרם",qty:n0(i&&i.qty),
      src:s(i&&i.src,20),found:s(i&&i.found,120),barcode:s(i&&i.barcode,20),
      est:!!(i&&i.est),
      per:{k:n0(p.k),p:n0(p.p),c:n0(p.c),f:n0(p.f),s:n0(p.s),b:n0(p.b)}};
  });
  if(o.stated&&typeof o.stated==="object"){
    r.stated=plausibleMacros({k:n0(o.stated.k),p:n0(o.stated.p),
      c:n0(o.stated.c),f:n0(o.stated.f)});
    delete r.stated.fixed;delete r.stated.complete;
  }
  return r;
}

/* ============ סנכרון ============ */
function fsBase(){return "https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(projectId)+"/databases/(default)/documents/recipes"}
function fsErr(o){
  var m=(o.d&&o.d.error&&o.d.error.message)||"";
  if(o.status===403)return "אין הרשאה. בדוק את כללי הגישה של Firestore.";
  if(o.status===404)return "מזהה הפרויקט לא נמצא, או שלא נוצר מסד Firestore.";
  if(o.status===400&&/API key/i.test(m))return "מפתח Firebase לא תקין.";
  return m||"השרת החזיר שגיאה "+o.status+".";
}
function cloudList(){
  return req("קריאת ענן",fsBase()+"?key="+encodeURIComponent(fbKey)+"&pageSize=300").then(function(o){
    if(!o.ok)throw new Error(fsErr(o));
    return (o.d.documents||[]).map(function(doc){
      try{return sanitizeRecipe(JSON.parse(doc.fields.json.stringValue))}catch(e){return null}}).filter(Boolean)});
}
function cloudPut(r){
  var body=JSON.stringify(r);
  if(body.length>900000)return Promise.reject(new Error("המתכון כבד מדי לענן ("+Math.round(body.length/1024)+"KB). הסר תמונה אחת ונסה שוב."));
  return req("כתיבה לענן",fsBase()+"/"+encodeURIComponent(r.id)+"?key="+encodeURIComponent(fbKey),
    {method:"PATCH",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({fields:{json:{stringValue:body},updated:{integerValue:String(r.updated||0)}}})})
  .then(function(o){if(!o.ok)throw new Error(fsErr(o))});
}
function cloudDel(id){
  return req("מחיקה בענן",fsBase()+"/"+encodeURIComponent(id)+"?key="+encodeURIComponent(fbKey),{method:"DELETE"});
}
function syncNow(){
  if(!cloudOn())return Promise.resolve();
  syncMsg="מסנכרן…"; if(view==="list")drawList();
  return cloudList().then(function(list){
    var local={},cloudIds={},i;
    recipes.forEach(function(r){local[r.id]=r});
    list.forEach(function(cr){cloudIds[cr.id]=1;
      var lo=local[cr.id];
      if(!lo)recipes.push(cr);
      else if((cr.updated||0)>(lo.updated||0)){for(i=0;i<recipes.length;i++)if(recipes[i].id===cr.id)recipes[i]=cr}});
    var pushes=recipes.filter(function(r){return !cloudIds[r.id]});
    recipes.sort(function(a,b){return (b.updated||0)-(a.updated||0)});
    saveRecipes();
    return Promise.all(pushes.map(cloudPut));
  }).then(function(){syncMsg="";lastSync=Date.now();err="";render()})
   .catch(function(e){syncMsg="";err="הסנכרון נכשל: "+e.message;render()});
}

/* תיקון מתכונים שכבר נשמרו עם ערכי מאקרו בלתי אפשריים */
function repairSaved(){
  var changed=[];
  recipes.forEach(function(r){
    if(!r.stated||!(Number(r.stated.k)>0))return;
    var before=JSON.stringify([r.stated.p,r.stated.c,r.stated.f]);
    var fixed=plausibleMacros({k:Number(r.stated.k),p:Number(r.stated.p)||0,
      c:Number(r.stated.c)||0,f:Number(r.stated.f)||0});
    delete fixed.fixed;delete fixed.complete;
    if(JSON.stringify([fixed.p,fixed.c,fixed.f])!==before){
      r.stated=fixed;r.updated=Date.now();changed.push(r);
    }
  });
  if(!changed.length)return;
  saveRecipes();
  if(cloudOn())changed.forEach(function(r){cloudPut(r).catch(function(){})});
}

var FOOD_PROMPT='Find the nutrition facts for this specific food product. Search the web. '+
'Prefer the manufacturer label or an official retailer listing. If the exact product is not found, '+
'use the closest equivalent product of the same type and say so in "note".\n'+
'Return ONLY valid JSON, no markdown:\n'+
'{"name":"product name in Hebrew, including brand if known",'+
'"per100":{"k":kcal,"p":protein g,"c":carbs g,"f":fat g,"s":saturated fat g,"b":fiber g} or null,'+
'"unit":{"name":"unit name in Hebrew e.g. טורטייה","grams":weight of one unit in grams,'+
'"k":kcal,"p":num,"c":num,"f":num,"s":num,"b":num} or null,'+
'"source":"brand or site the numbers came from","note":"short Hebrew caveat if the match is not exact, else empty string"}\n'+
'Give per100 whenever possible. Give unit only if the product has a clear per-unit serving on the label. '+
'Numbers only, no text inside numeric fields. Product: ';

function aiFindFood(name){
  var url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+
    ":generateContent?key="+encodeURIComponent(apiKey);
  function ask(useSearch){
    var body={contents:[{parts:[{text:FOOD_PROMPT+name}]}],generationConfig:{temperature:0,maxOutputTokens:2048}};
    if(useSearch)body.tools=[{google_search:{}}];
    else body.generationConfig.responseMimeType="application/json";
    return req(useSearch?"חיפוש מוצר ברשת":"חיפוש מוצר (ללא רשת)",url,
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  }
  return ask(true).then(function(o){
    if(!o.ok&&o.status===400)return ask(false);
    return o;
  }).then(function(o){
    if(!o.ok){
      var m=(o.d.error&&o.d.error.message)||"";
      if(o.status===429)throw new Error("חרגת מהמכסה החינמית. נסה שוב בעוד כמה דקות.");
      throw new Error(m||("השירות החזיר שגיאה "+o.status+"."));
    }
    var cand=o.d.candidates&&o.d.candidates[0];
    var txt=(cand&&cand.content&&cand.content.parts)?cand.content.parts.map(function(p){return p.text||""}).join(""):"";
    var a=txt.indexOf("{"),b=txt.lastIndexOf("}");
    if(a<0||b<0)throw new Error("לא הוחזרו ערכים. נסה לנסח את שם המוצר אחרת.");
    return JSON.parse(txt.slice(a,b+1));
  });
}

/* ============ מאגר מוצרים פתוח (Open Food Facts) ============ */
var OFF_UA="&user_agent=PinkasMatkonim";
function offNum(o,k){
  if(!o)return null;
  var v=o[k];
  if(v===undefined||v===null||v==="")return null;
  var x=Number(v);
  return isFinite(x)?x:null;
}
/* קלוריות: kcal ישיר, ואם אין אז המרה מקילו-ג'אול */
function offKcal(nu,suf){
  var k=offNum(nu,"energy-kcal"+suf);
  if(k!==null)return k;
  k=offNum(nu,"energy-kcal_value");
  if(k!==null&&suf==="_100g")return k;
  var kj=offNum(nu,"energy-kj"+suf);
  if(kj===null)kj=offNum(nu,"energy"+suf);
  return kj===null?null:kj/4.184;
}
function offSet(nu,suf){
  var k=offKcal(nu,suf);
  if(k===null)return null;
  return{k:k,p:offNum(nu,"proteins"+suf)||0,c:offNum(nu,"carbohydrates"+suf)||0,
    f:offNum(nu,"fat"+suf)||0,s:offNum(nu,"saturated-fat"+suf)||0,b:offNum(nu,"fiber"+suf)||0};
}
function parseServingG(txt){
  var t=String(txt||"");
  var m=t.match(/(\d+(?:[.,]\d+)?)\s*(g|gr|gram|גרם|ml|מ"ל)/i);
  if(m)return Number(String(m[1]).replace(",","."));
  m=t.match(/^(\d+(?:[.,]\d+)?)$/);
  return m?Number(String(m[1]).replace(",",".")):null;
}
function offNorm(p){
  var nu=p.nutriments||{};
  var per100=offSet(nu,"_100g"),perServ=offSet(nu,"_serving");
  var srv=parseServingG(p.serving_size)||offNum(p,"serving_quantity");
  /* אם יש רק ערכים למנה ויודעים את משקלה — גוזרים מהם ערכים ל-100 גרם */
  if(!per100&&perServ&&srv>0){
    per100={k:perServ.k/srv*100,p:perServ.p/srv*100,c:perServ.c/srv*100,
      f:perServ.f/srv*100,s:perServ.s/srv*100,b:perServ.b/srv*100};
  }
  /* ואם יש רק ערכים ל-100 גרם ומשקל מנה — גוזרים את המנה */
  if(per100&&!perServ&&srv>0){
    perServ={k:per100.k*srv/100,p:per100.p*srv/100,c:per100.c*srv/100,
      f:per100.f*srv/100,s:per100.s*srv/100,b:per100.b*srv/100};
  }
  return{name:(p.product_name_he||p.product_name||"").trim()||"מוצר ללא שם",
    brand:(p.brands||"").split(",")[0].trim(),
    code:p.code||"",servingG:srv||null,per100:per100,perServ:perServ,
    hasData:!!per100};
}
var OFF_FIELDS="product_name,product_name_he,brands,code,serving_size,serving_quantity,nutriments";
function offSearch(term){
  var t=String(term||"").trim().replace(/[\s-]/g,"");
  if(/^\d{8,14}$/.test(t)){
    return req("מוצר לפי ברקוד","https://world.openfoodfacts.org/api/v2/product/"+t+".json?fields="+OFF_FIELDS+OFF_UA)
    .then(function(o){
      if(o.status===404||!o.d||o.d.status===0||!o.d.product)
        throw new Error("הברקוד לא נמצא במאגר. אפשר להזין את הערכים ידנית מהאריזה.");
      if(!o.ok)throw new Error("החיפוש נכשל (HTTP "+o.status+").");
      return [offNorm(o.d.product)];
    });
  }
  return req("חיפוש מוצר","https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=12&fields="+
    OFF_FIELDS+"&search_terms="+encodeURIComponent(String(term).trim())+OFF_UA)
  .then(function(o){
    if(o.status===429)throw new Error("יותר מדי חיפושים בדקה האחרונה. המתן רגע ונסה שוב.");
    if(!o.ok)throw new Error("החיפוש נכשל (HTTP "+o.status+").");
    return (o.d.products||[]).map(offNorm).filter(function(x){return x.name});
  });
}
function applyOff(p,mode){
  var d=ingEdit;
  d.name=(p.brand?p.brand+" ":"")+p.name;
  d.src="off";d.found="Open Food Facts"+(p.code?" · "+p.code:"");d.foundNote="";
  d.barcode=p.code||"";
  if(mode==="unit"&&p.perServ){
    d.basis="unit";d.unitName=p.servingG?("יחידה ("+r1(p.servingG)+" גר')"):"יחידה";
    d.per={k:r1(p.perServ.k),p:r1(p.perServ.p),c:r1(p.perServ.c),
      f:r1(p.perServ.f),s:r1(p.perServ.s),b:r1(p.perServ.b)};
  }else if(p.per100){
    d.basis="100g";
    d.per={k:r1(p.per100.k),p:r1(p.per100.p),c:r1(p.per100.c),
      f:r1(p.per100.f),s:r1(p.per100.s),b:r1(p.per100.b)};
    if(p.servingG>0){var u={};u["יחידה"]=p.servingG;d.units=u}
  }else{
    d.foundNote="למוצר הזה אין ערכים תזונתיים במאגר. הזן אותם מהאריזה.";
  }
  d.offHit=p;
}

/* ============ קריאה מקומית: OCR ============ */
var TESS="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise(function(res,rej){
    var s=document.createElement("script");s.src=TESS;
    s.onload=function(){res()};
    s.onerror=function(){rej(new Error("טעינת מנוע הקריאה נכשלה. בפעם הראשונה נדרש חיבור לאינטרנט."))};
    document.head.appendChild(s);
  });
}
function prepImage(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var sc=Math.min(2,Math.max(1,1400/img.width));
        var cv=document.createElement("canvas");
        cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
        var ctx=cv.getContext("2d");
        ctx.drawImage(img,0,0,cv.width,cv.height);
        var d=ctx.getImageData(0,0,cv.width,cv.height),a=d.data,sum=0,i;
        for(i=0;i<a.length;i+=4){
          var g=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
          a[i]=a[i+1]=a[i+2]=g;sum+=g;

    if(iStep<0&&/(how to|directions|instructions|method|preparation|steps|אופן ההכנה|הוראות|הכנה)/.test(l))iStep=i;
  }
  var joined=raw.join(" ");
  var source=findSource(raw);
  var title=findTitle(raw,iIng>0?iIng:Math.min(8,raw.length),source);
  var ingLines=[],stepLines=[];
  var from=iIng>=0?iIng+1:0,to=iStep>=0?iStep:raw.length;
  var STOP=/^(macros?|nutrition|original creator|recipe by|comment\b)|\b(calories|kcal)\b|^per\s+\w+|\b1\s*(of|out of)\s*\d|#\w/i;
  for(i=from;i<to;i++){
    if(STOP.test(raw[i]))break;
    ingLines.push(raw[i]);
  }
  if(iStep>=0)for(i=iStep+1;i<raw.length;i++){
    l=raw[i];
    if(/^(macros?|nutrition|original creator)/i.test(l))break;
    if(/#\w/.test(l))continue;
    if(NOISE.test(l))continue;
    stepLines.push(l.replace(/^\d+[\.\)]\s*/,""));
  }
  var mac=parseMacros(raw);
  var ings=[];
  ingLines.forEach(function(x){
    if(/^(macros?|nutrition|comment|follow)/i.test(x))return;
    if(x.length>90)return;
    var g=parseIngLine(x);if(g)ings.push(g)});
  return{title:title,source:source,yield:findYield(raw),ingredients:ings,
    ingredientsSrc:ingLines.join("\n"),
    stepsSrc:stepLines.join("\n"),steps:stepLines.map(convText).join("\n"),
    stated:mac.stated,statedBasis:mac.basis,servings:mac.servings,svKnown:mac.svKnown!==false,
    raw:raw.join("\n")};
}

var modelList=null,modelBusy=false,modelErr="";
function loadModels(key){
  modelBusy=true;modelErr="";modelList=null;drawSettings();
  return req("רשימת דגמים","https://generativelanguage.googleapis.com/v1beta/models?key="+encodeURIComponent(key)+"&pageSize=200")
  .then(function(o){
    modelBusy=false;
    if(!o.ok)throw new Error((o.d.error&&o.d.error.message)||("HTTP "+o.status));
    modelList=(o.d.models||[]).filter(function(m){
      return (m.supportedGenerationMethods||[]).indexOf("generateContent")>=0;
    }).map(function(m){
      return{id:String(m.name||"").replace(/^models\//,""),label:m.displayName||""};
    }).filter(function(m){return /gemini/i.test(m.id)&&!/embedding|aqa|tts|image|video|audio|live|native/i.test(m.id)})
    .sort(function(a,b){
      var af=/flash/i.test(a.id)?0:1,bf=/flash/i.test(b.id)?0:1;
      if(af!==bf)return af-bf;
      return a.id<b.id?-1:1;});

/* ============ קריאה מצילום מסך ============ */
var PROMPT='You extract a recipe from a screenshot of a social media post.\n'+
'Return ONLY valid JSON, no markdown, matching exactly:\n'+
'{"title":"recipe name in Hebrew","source":"author handle or empty string","yield":"what the post says it makes, in Hebrew, e.g. 18 רולים / 6 מנות",'+
'"ingredients":[{"name":"generic ingredient name in Hebrew","grams":grams used in the WHOLE recipe,"k":kcal,"p":protein g,"c":carbs g,"f":fat g,"s":saturated fat g,"b":fiber g}],'+
'"ingredientsOriginal":["ingredient line exactly as written in the post, original language and units, unchanged"],'+
'"steps":["step in Hebrew"],"stepsOriginal":["step exactly as written in the post, original language, unchanged"],'+
'"stated":{"k":num,"p":num,"c":num,"f":num} or null,'+
'"statedBasis":"total" if the posted macros cover the whole recipe, or "serving" if they are per one serving,'+
'"servingsCount":integer number of servings or units the whole recipe makes (1 if it makes a single portion),'+
'"note":"short Hebrew note about anything ambiguous or brand-dependent, or empty string"}\n'+
'Rules:\n'+
'- ingredient values are for the FULL amount used in the recipe, NOT per serving.\n'+
'- Convert every imperial unit: lb/oz/cups/tbsp/tsp to grams or ml, Fahrenheit to Celsius, inches to cm. Apply this inside the step text too.\n'+
'- "stated" = per-serving macros exactly as written in the post. null if none.\n'+
'- Steps in Hebrew, imperative, one action per step.\n'+
'- Estimate rather than omit any field.';

function fileToB64(file){return new Promise(function(res,rej){
  var r=new FileReader();
  r.onload=function(){var d=r.result;res({mime:d.slice(5,d.indexOf(";")),data:d.split(",")[1]})};
  r.onerror=function(){rej(new Error("קריאת הקובץ נכשלה"))};
  r.readAsDataURL(file)})}

function callModel(parts){
  return req("קריאת מתכון","https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(apiKey),
    {method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({contents:[{parts:parts}],generationConfig:{temperature:0,maxOutputTokens:8192,responseMimeType:"application/json"}})})
  .then(function(o){
    if(!o.ok){
      var m=(o.d.error&&o.d.error.message)||"";
      if(o.status===400&&/API key|API_KEY/i.test(m))throw new Error("המפתח לא תקין. בדוק אותו בהגדרות.");
      if(o.status===404)throw new Error("שם המודל לא נמצא. עדכן אותו בהגדרות.");
      if(o.status===429)throw new Error("חרגת מהמכסה החינמית. נסה שוב בעוד כמה דקות.");
      throw new Error(m||("השירות החזיר שגיאה "+o.status+"."));
    }
    var cand=o.d.candidates&&o.d.candidates[0];
    var txt=(cand&&cand.content&&cand.content.parts)?cand.content.parts.map(function(p){return p.text||""}).join(""):"";
    if(!txt)throw new Error("לא התקבל תוכן. נסה צילום ברור יותר.");
    var a=txt.indexOf("{"),b=txt.lastIndexOf("}");
    if(a<0||b<0)throw new Error("התשובה לא הגיעה בפורמט צפוי.");
    return JSON.parse(txt.slice(a,b+1));
  });
}
function matchFood(name){
  var n=String(name||"").trim(),list=foods(),best=null,i,f;
  for(i=0;i<list.length;i++){f=list[i];
    if(n===f.n)return f;
    if(n.indexOf(f.n)>=0||f.n.indexOf(n)>=0){if(!best||f.n.length>best.n.length)best=f}}
  return best;
}
function buildIngredient(raw){
  var g=Number(raw.grams)||0,f=g>0?matchFood(raw.name):null;
  if(f)return{name:raw.name||f.n,basis:"100g",unitName:"גרם",qty:g,src:"db",
    per:{k:f.k,p:f.p,c:f.c,f:f.f,s:f.s||0,b:f.b||0}};
  if(g>0)return{name:raw.name||"מרכיב",basis:"100g",unitName:"גרם",qty:g,src:"ai",
    per:{k:(Number(raw.k)||0)/g*100,p:(Number(raw.p)||0)/g*100,c:(Number(raw.c)||0)/g*100,
         f:(Number(raw.f)||0)/g*100,s:(Number(raw.s)||0)/g*100,b:(Number(raw.b)||0)/g*100}};
  return{name:raw.name||"מרכיב",basis:"unit",unitName:"יחידה",qty:1,src:"ai",
    per:{k:Number(raw.k)||0,p:Number(raw.p)||0,c:Number(raw.c)||0,f:Number(raw.f)||0,s:Number(raw.s)||0,b:Number(raw.b)||0}};
}

function runOcr(files){
  busy="מכין…";render();
  return ocrFiles(files).then(function(text){
    var r=parseRecipe(text);
    var e=blank();
    e.title=r.title||"";e.source=r.source||"";e.yield=r.yield||"";
    e.ingredients=r.ingredients;e.ingredientsSrc=r.ingredientsSrc||"";
    e.stepsSrc=r.stepsSrc;e.steps=r.steps;
    e.stated=r.stated;e.statedBasis=r.statedBasis;e.servings=r.servings||1;e.svKnown=r.svKnown!==false;
    e.note="";
    busy="";editing=e;reviewMode=true;
    if(!e.ingredients.length){err="הצלחתי לקרוא טקסט אבל לא זיהיתי רשימת מרכיבים. הטקסט המלא נשמר בשדה המקור.";
      e.stepsSrc=r.raw.slice(0,4000)}
    go("edit");
  }).catch(function(x){busy="";err=x.message||"הקריאה נכשלה.";view="list";render()});
}

picker.onchange=function(ev){
  var files=Array.prototype.slice.call(ev.target.files||[]);
  ev.target.value="";
  if(!files.length)return;
  err="";
  if(useOcr())return runOcr(files);
  Promise.all(files.map(fileToB64)).then(function(imgs){
    var parts=imgs.map(function(b){return{inline_data:{mime_type:b.mime,data:b.data}}});
    parts.push({text:files.length>1?PROMPT+"\nThe images are consecutive screenshots of the SAME post. Merge them into one recipe.":PROMPT});
    busy="קורא את המתכון…";render();
    return callModel(parts);
  }).then(function(r){
    var e=blank();
    e.title=r.title||"";e.source=r.source||"";e.yield=r.yield||"";
    e.ingredients=(r.ingredients||[]).map(buildIngredient);
    e.steps=(r.steps||[]).join("\n");
    e.stepsSrc=Array.isArray(r.stepsOriginal)?r.stepsOriginal.join("\n"):"";
    e.ingredientsSrc=Array.isArray(r.ingredientsOriginal)?r.ingredientsOriginal.join("\n"):"";
    e.note=r.note||"";
    if(r.stated&&r.stated.k){
      e.stated=plausibleMacros({k:+r.stated.k,p:+r.stated.p||0,
        c:+r.stated.c||0,f:+r.stated.f||0});
      delete e.stated.complete;delete e.stated.fixed;
      e.statedBasis=(r.statedBasis==="serving")?"serving":"total";
    }
    e.servings=Math.max(1,parseInt(r.servingsCount)||1);
    busy="";editing=e;reviewMode=true;go("edit");
  }).catch(function(e){busy="";err=e.message||"משהו השתבש.";view="list";render()});
};

/* ============ אירועים ============ */
document.addEventListener("click",function(ev){
  /* קישור חיצוני — נותנים לדפדפן לטפל בו, בלי לפתוח את המתכון */
  if(ev.target.closest("a"))return;

  var card=ev.target.closest("[data-open]");
  if(card&&!ev.target.closest("button")){
    openId=card.dataset.open;go("detail");return}

  var b=ev.target.closest("button");if(!b)return;var i,l;

  if(b.dataset.open){openId=b.dataset.open;go("detail");return}
  if(b.dataset.edit){for(i=0;i<recipes.length;i++)if(recipes[i].id===openId)editing=JSON.parse(JSON.stringify(recipes[i]));
    reviewMode=false;go("edit");return}
  if(b.dataset.del){
    if(!confirm(cloudOn()?"למחוק את המתכון? הוא יימחק גם אצל כל השאר.":"למחוק את המתכון?"))return;
    if(cloudOn())cloudDel(openId);
    recipes=recipes.filter(function(x){return x.id!==openId});
    saveRecipes();go("list");return}
  if(b.dataset.rm){editing.ingredients.splice(parseInt(b.dataset.rm),1);drawEdit();return}

  if(b.dataset.ed){
    var n=parseInt(b.dataset.ed),cur=editing.ingredients[n];
    ingEdit={index:n,name:cur.name,basis:cur.basis,unitName:cur.unitName,qty:cur.qty,
      per:{k:cur.per.k,p:cur.per.p,c:cur.per.c,f:cur.per.f,s:cur.per.s||0,b:cur.per.b||0},
      src:cur.src,toDb:false,found:cur.found||"",foundNote:"",units:(matchFood(cur.name)||{}).u||null};
    searchQ="";searchHits=null;searchErr="";go("ingredient");return}

  if(b.dataset.sb&&editing){editing.statedBasis=b.dataset.sb;drawEdit();return}

  if(b.dataset.cat!==undefined&&editing){editing.cat=b.dataset.cat;drawEdit();return}
  if(b.dataset.filter!==undefined){filterCat=b.dataset.filter;drawList();return}

  if(b.dataset.model){
    model=b.dataset.model;write(K_MODEL,model);drawSettings();return}

  if(b.dataset.web100!==undefined){
    var wi=parseInt(b.dataset.web100);
    if(searchHits&&searchHits.web&&searchHits.web[wi]){
      applyOff(searchHits.web[wi],"100g");searchHits=null;searchQ="";drawIngredient()}
    return}

  if(b.dataset.webunit!==undefined){
    var wu=parseInt(b.dataset.webunit);
    if(searchHits&&searchHits.web&&searchHits.web[wu]){
      applyOff(searchHits.web[wu],"unit");searchHits=null;searchQ="";drawIngredient()}
    return}

  if(b.dataset.loc){
    l=foods();
    for(i=0;i<l.length;i++)if(l[i].n===b.dataset.loc){
      ingEdit.name=l[i].n;ingEdit.units=l[i].u||null;ingEdit.src="db";
      ingEdit.found="מאגר מקומי";ingEdit.foundNote="";ingEdit.basis="100g";
      ingEdit.per={k:l[i].k,p:l[i].p,c:l[i].c,f:l[i].f,s:l[i].s||0,b:l[i].b||0};
    }
    searchHits=null;searchQ="";drawIngredient();return}

  if(b.dataset.web){
    var term=query.trim();
    if(!term)return;
    ingEdit=blankDraft(term);query="";searchQ="";searchHits=null;aiBusy=true;go("ingredient");
    aiFindFood(term).then(function(r){applyFound(r);aiBusy=false;drawIngredient()})
    .catch(function(e){aiBusy=false;drawIngredient();alert("החיפוש נכשל: "+e.message)});
    return}

  if(b.dataset.pick){
    if(b.dataset.pick==="__new__"){ingEdit=blankDraft(query.trim())}
    else{l=foods();for(i=0;i<l.length;i++)if(l[i].n===b.dataset.pick)ingEdit=foodToDraft(l[i])}
    query="";searchQ="";searchHits=null;go("ingredient");return}


  if(b.dataset.basis){ingEdit.basis=b.dataset.basis;drawIngredient();return}
  if(b.dataset.unit){
    var g=ingEdit.units[b.dataset.unit];
    ingEdit.basis="100g";ingEdit.qty=g;drawIngredient();return}

  if(b.id==="sync"){syncNow();return}
  if(b.id==="push"){
    if(!cloudOn())return;
    syncMsg="מעלה "+recipes.length+" מתכונים…";drawList();
    Promise.all(recipes.map(function(r){if(!r.updated)r.updated=Date.now();return cloudPut(r)}))
    .then(function(){saveRecipes();syncMsg="";lastSync=Date.now();err="";
      alert("כל המתכונים הועלו לענן.");render()})
    .catch(function(e){syncMsg="";err="ההעלאה נכשלה: "+e.message;render()});
    return}
  if(b.id==="exp"){
    var blob=new Blob([JSON.stringify({recipes:recipes,customFoods:customFoods},null,1)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="recipes-backup.json";a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);return}
  if(b.id==="imp"){
    var inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
    inp.onchange=function(){var fr=new FileReader();
      fr.onload=function(){try{
        var d=JSON.parse(fr.result),inc=d.recipes||[],ids={};
        recipes.forEach(function(r){ids[r.id]=1});
        var fresh=inc.filter(function(r){return !ids[r.id]});
        recipes=recipes.concat(fresh);
        if(d.customFoods){var cn={};customFoods.forEach(function(f){cn[f.n]=1});
          customFoods=customFoods.concat(d.customFoods.filter(function(f){return !cn[f.n]}));write(K_FOOD,customFoods)}
        saveRecipes();go("list");alert("הייבוא הושלם. נוספו "+fresh.length+" מתכונים.");
      }catch(e){alert("הקובץ לא תקין.")}};
      fr.readAsText(inp.files[0])};
    inp.click();return}
});

document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter"&&ev.key!==" ")return;
  var t=ev.target;
  if(!t||!t.closest)return;
  var card=t.closest("[data-open]");
  if(!card||t.closest("a")||t.closest("button"))return;
  ev.preventDefault();
  openId=card.dataset.open;go("detail");
});

repairSaved();
render();
if(cloudOn())syncNow().then(repairSaved);
</script>
</body>
</html>
